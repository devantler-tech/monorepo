version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      # Internal devantler-tech actions/reusable-workflows are trusted (our own
      # code) — bump immediately, never hold them in cooldown.
      exclude:
        - "devantler-tech/*"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    # Opt in to the org-level "Git Source" registry (https://github.com, a classic
    # PAT) so Dependabot can reach every submodule this repo tracks — including the
    # ones outside devantler-tech, since github/personal/* point at the maintainer's
    # own account. Without access the whole "submodules in /." job fails with
    # git_dependencies_not_reachable. The credential lives in the org's Dependabot
    # private-registries UI (not a repo secret); .gitmodules keeps its SSH URLs, so
    # local `git submodule` operations are unaffected.
    registries: "*"
    schedule:
      interval: "daily"

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      # astro-mermaid renders the site's diagrams and declares
      # `peer mermaid@"^10.0.0 || ^11.0.0"`, so a mermaid major breaks `npm ci`
      # with ERESOLVE and the docs build never starts. No published
      # astro-mermaid version widens that range, so a mermaid 12 PR can only
      # ever sit red. Minor and patch updates still come through.
      # Drop this entry once astro-mermaid ships a release accepting mermaid 12.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
