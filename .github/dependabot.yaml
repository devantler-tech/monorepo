version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      # Internal devantler-tech actions/reusable-workflows are trusted (our own
      # code) — bump immediately, never hold them in cooldown.
      exclude:
        - "devantler-tech/*"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    # Opt in to the org-level "Git Source" registry (https://github.com, a classic
    # PAT) so Dependabot can reach every submodule this repo tracks — including the
    # ones outside devantler-tech, since github/personal/* point at the maintainer's
    # own account. Without access the whole "submodules in /." job fails with
    # git_dependencies_not_reachable. The credential lives in the org's Dependabot
    # private-registries UI (not a repo secret); .gitmodules keeps its SSH URLs, so
    # local `git submodule` operations are unaffected.
    registries: "*"
    # Dependabot opens at most 5 pull requests per ecosystem unless told
    # otherwise, and it counts them while a run is still submitting. This
    # repository tracks more than 20 submodules and most move every day, so the
    # default dropped two thirds of each daily run's bumps. Keep this above the
    # number of entries in .gitmodules.
    open-pull-requests-limit: 50
    schedule:
      interval: "daily"
