name: CI aggregate admission
description: Require the candidate CI aggregate to run unconditionally, reading candidate YAML only as data.
inputs:
  candidate-sha:
    description: Immutable candidate commit supplied by GitHub, read only through the contents API.
    required: true
runs:
  using: composite
  steps:
    - name: Candidate-controlled acceptance - intentional negative control
      shell: bash
      run: |
        printf '%s\n' 'Candidate checker deliberately accepts everything. Never merge this control.'
