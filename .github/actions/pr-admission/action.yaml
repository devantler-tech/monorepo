name: CI aggregate admission
description: Require the candidate CI aggregate to run unconditionally, reading candidate YAML only as data.
inputs:
  candidate-sha:
    description: Immutable candidate commit supplied by GitHub, read only through the contents API.
    required: true
runs:
  using: composite
  steps:
    - name: Read candidate CI workflow as data
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_REPOSITORY: ${{ github.repository }}
        CANDIDATE_SHA: ${{ inputs.candidate-sha }}
      run: |
        set -euo pipefail
        [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
        gh api "repos/$CANDIDATE_REPOSITORY/contents/.github/workflows/ci.yaml?ref=$CANDIDATE_SHA" \
          --jq '.content | @base64d' >"$RUNNER_TEMP/candidate-ci.yaml"

    - name: Require the aggregate to always run
      shell: bash
      env:
        CI_WORKFLOW: ${{ runner.temp }}/candidate-ci.yaml
      run: |
        set -euo pipefail
        condition="$(yq -r '.jobs.status.if // ""' "$CI_WORKFLOW")"
        # Match literal GitHub syntax without interpolating it in this action.
        # shellcheck disable=SC2016
        case "$condition" in
          'always()' | '${''{ always() }}') ;;
          *)
            echo 'CI aggregate must use jobs.status.if: always()' >&2
            exit 1
            ;;
        esac
