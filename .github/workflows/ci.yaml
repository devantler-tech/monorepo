name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      docs-deps: ${{ steps.filter.outputs.docs-deps }}
      active-projects: ${{ steps.filter.outputs.active-projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            docs:
              - 'docs/**'
            docs-deps:
              - 'docs/package.json'
              - 'docs/package-lock.json'
            active-projects:
              - 'docs/src/content/docs/projects/active.mdx'
              - 'docs/src/content/docs/templates/**'
              - 'docs/scripts/check-active-projects-drift.sh'
              - 'docs/scripts/check-active-projects-drift.test.sh'
              - '.gitmodules'
              - 'github/devantler-tech/github-actions/actions'
              - 'github/devantler-tech/github-actions/reusable-workflows'

  build-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Build
        working-directory: docs
        run: npm run build

  audit-docs:
    needs: changes
    if: needs.changes.outputs.docs-deps == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Audit
        working-directory: docs
        run: npm audit --omit=dev

  drift-check-active-projects:
    needs: changes
    if: needs.changes.outputs.active-projects == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Verify the drift checker itself first — self-contained fixtures, no
      # submodule checkout needed, so it fails fast if a refactor broke a check.
      - name: Self-test the drift checker
        run: bash docs/scripts/check-active-projects-drift.test.sh
      # The source-of-truth repos are public submodules; check out only those
      # two at their pinned commits (no GitHub API, no other submodules). The
      # .gitmodules URLs are SSH (git@github.com:), which the runner has no key
      # for, so point them at public HTTPS first to clone anonymously.
      - name: Check out source submodules
        run: |
          git submodule set-url github/devantler-tech/github-actions/actions https://github.com/devantler-tech/actions.git
          git submodule set-url github/devantler-tech/github-actions/reusable-workflows https://github.com/devantler-tech/reusable-workflows.git
          git submodule update --init --depth 1 \
            github/devantler-tech/github-actions/actions \
            github/devantler-tech/github-actions/reusable-workflows
      - name: Check Active Projects lists for drift
        run: bash docs/scripts/check-active-projects-drift.sh

  status:
    name: "CI - Required Checks"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-docs
      - audit-docs
      - drift-check-active-projects
    permissions: {}
    steps:
      - name: Check job results
        uses: devantler-tech/actions/aggregate-job-checks@23a6d6ad0152839e3012a885b3029931628f1b9b # v9.0.5
        with:
          job-results: >-
            ${{ needs.build-docs.result }}
            ${{ needs.audit-docs.result }}
            ${{ needs.drift-check-active-projects.result }}
