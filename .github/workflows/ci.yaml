name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      docs-deps: ${{ steps.filter.outputs.docs-deps }}
      active-projects: ${{ steps.filter.outputs.active-projects }}
      safe-clone: ${{ steps.filter.outputs.safe-clone }}
      branch-cleanup: ${{ steps.filter.outputs.branch-cleanup }}
      worktree-cleanup: ${{ steps.filter.outputs.worktree-cleanup }}
      submodule-init: ${{ steps.filter.outputs.submodule-init }}
      maintainer-preflight: ${{ steps.filter.outputs.maintainer-preflight }}
      self-review-contract: ${{ steps.filter.outputs.self-review-contract }}
      review-provider-loop-contract: ${{ steps.filter.outputs.review-provider-loop-contract }}
      agent-role-delivery-contract: ${{ steps.filter.outputs.agent-role-delivery-contract }}
      work-priority-ladder: ${{ steps.filter.outputs.work-priority-ladder }}
      merge-confirmation-read: ${{ steps.filter.outputs.merge-confirmation-read }}
      portfolio-surveyor: ${{ steps.filter.outputs.portfolio-surveyor }}
      product-value: ${{ steps.filter.outputs.product-value }}
      agent-telemetry: ${{ steps.filter.outputs.agent-telemetry }}
      board-add: ${{ steps.filter.outputs.board-add }}
      flow-scorecard: ${{ steps.filter.outputs.flow-scorecard }}
      memory-hygiene: ${{ steps.filter.outputs.memory-hygiene }}
      worktree-claim: ${{ steps.filter.outputs.worktree-claim }}
      renovate-dashboard: ${{ steps.filter.outputs.renovate-dashboard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            docs:
              - 'docs/**'
            docs-deps:
              - 'docs/package.json'
              - 'docs/package-lock.json'
            active-projects:
              # The retired-link guard greps the WHOLE content tree, so it must
              # run for ANY content change — gating it on the two pages the
              # drift lists live in would let a retired link ship from a blog
              # post or any other page the guard claims to cover.
              - 'docs/src/content/**'
              - 'docs/scripts/check-active-projects-drift.sh'
              - 'docs/scripts/check-active-projects-drift.test.sh'
              - 'docs/scripts/check-homepage-project-parity.mjs'
              - 'docs/package.json'
              - 'docs/package-lock.json'
              - '.gitmodules'
              - 'github/devantler-tech/github-actions/actions'
            agent-telemetry:
              - '.claude/scripts/agent-telemetry.sh'
              - '.claude/scripts/agent-telemetry.test.sh'
              # Self-gate on the workflow too, so a change that breaks this
              # job's own wiring still runs the test it gates.
              - '.github/workflows/ci.yaml'
            board-add:
              - '.claude/scripts/board-add.sh'
              - '.claude/scripts/board-add.test.sh'
              # Self-gate on the workflow too, so a change that breaks this
              # job's own wiring still runs the test it gates.
              - '.github/workflows/ci.yaml'
            worktree-claim:
              - '.claude/scripts/worktree-claim.sh'
              - '.claude/scripts/worktree-claim.test.sh'
              - '.claude/skills/portfolio-maintenance/SKILL.md'
              - 'AGENTS.md'
              # Self-gate on the workflow too, so a change that breaks this
              # job's own wiring still runs the test it gates.
              - '.github/workflows/ci.yaml'
            flow-scorecard:
              - '.claude/scripts/flow-scorecard.sh'
              - '.claude/scripts/flow-scorecard.test.sh'
              # Self-gate on the workflow too, so a change that breaks this
              # job's own wiring still runs the test it gates.
              - '.github/workflows/ci.yaml'
            safe-clone:
              - '.claude/scripts/safe-clone.sh'
              - '.claude/scripts/safe-clone.test.sh'
            branch-cleanup:
              - '.claude/scripts/branch-cleanup.sh'
              - '.claude/scripts/branch-cleanup.test.sh'
            worktree-cleanup:
              - '.claude/scripts/worktree-cleanup.sh'
              - '.claude/scripts/worktree-cleanup-all.sh'
              - '.claude/scripts/worktree-cleanup.test.sh'
              - '.claude/scripts/worktree-cleanup-all.test.sh'
              # Self-gate on the workflow too, so a change that breaks this
              # job's own wiring still runs the test it gates.
              - '.github/workflows/ci.yaml'
            submodule-init:
              - '.claude/scripts/submodule-init.sh'
              - '.claude/scripts/submodule-init.test.sh'
            memory-hygiene:
              - 'AGENTS.md'
              - '.claude/scripts/memory-hygiene.sh'
              - '.claude/scripts/memory-hygiene.test.sh'
              - '.claude/scripts/memory-hygiene-go/**'
              - '.claude/skills/portfolio-maintenance/SKILL.md'
              # Self-gate on the workflow too, so a change that breaks this
              # job's own wiring still runs the test it gates.
              - '.github/workflows/ci.yaml'
            renovate-dashboard:
              - '.claude/scripts/renovate-dashboard-drift.sh'
              - '.claude/scripts/renovate-dashboard-drift-go/**'
              # The declared roots are checked against .gitmodules, so a
              # submodule added or removed changes what this must verify.
              - '.gitmodules'
              # The monorepo's own config is one of the configs under test — and
              # every location the checker recognises has to be watched, not just
              # the one in use today. A PR that ADDS a root renovate.json, or a
              # root package.json carrying a "renovate" key, would otherwise
              # change none of these paths, skip the job, and land the config
              # the checker exists to adjudicate.
              - '.github/renovate.json'
              - '.github/renovate.json5'
              - 'renovate.json'
              - 'renovate.json5'
              - '.renovaterc'
              - '.renovaterc.json'
              - '.renovaterc.json5'
              - 'package.json'
              # A submodule bump can carry a changed Renovate config in, so the
              # gitlinks of the roots that carry one have to re-trigger this.
              # Without these the check would only run when the monorepo itself
              # changed, and a drift introduced upstream would land unexamined.
              #
              # Only these four are listed, and that bounds what this job can
              # catch: a repository that has NO config today and gains one
              # arrives as a gitlink outside this list, so the job is skipped.
              # Listing every submodule would not fix it on its own — the
              # checkout below clones only these roots, so an unlisted one is
              # not on disk to inspect either. The check prints the mapped
              # repositories it could not inspect rather than implying it
              # covered them.
              - 'platform'
              - 'libraries/kyverno-policies'
              - 'libraries/provider-upjet-unifi'
              - 'templates/platform-template'
              # Self-gate on the workflow too, so a change that breaks this
              # job's own wiring still runs the check it gates.
              - '.github/workflows/ci.yaml'
            maintainer-preflight:
              - '.claude/skills/portfolio-maintenance/SKILL.md'
              - '.claude/scripts/maintainer-preflight.test.sh'
            self-review-contract:
              - 'AGENTS.md'
              - '.coderabbit.yaml'
              - '.claude/skills/portfolio-maintenance/SKILL.md'
              - '.claude/skills/product-engineering/SKILL.md'
              - '.claude/scripts/self-review-contract.test.sh'
              - '.github/workflows/ci.yaml'
            review-provider-loop-contract:
              - 'AGENTS.md'
              - '.claude/agents/daily-maintainer.md'
              - '.claude/agents/portfolio-surveyor.md'
              - '.claude/plugin-consumption/agentic-engineering-surveyor-diff.md'
              - '.claude/skills/portfolio-maintenance/SKILL.md'
              - '.claude/scripts/review-provider-loop-contract.test.sh'
              - '.github/workflows/ci.yaml'
            agent-role-delivery-contract:
              - 'AGENTS.md'
              - '.claude/agents/daily-maintainer.md'
              - '.claude/loaders/cursor-daily-ai-engineer.md'
              # The two retired agent forks stay listed deliberately: the test asserts they
              # do NOT exist, so re-adding either must trigger the job that rejects it.
              - '.claude/agents/agent-improver.md'
              - '.claude/agents/finops-engineer.md'
              - '.claude/plugin-consumption/agentic-engineering.desired-state.json'
              - '.claude/settings.json'
              - '.claude/skills/agent-improvement/**'
              - '.claude/skills/portfolio-maintenance/SKILL.md'
              - '.claude/skills/product-engineering/SKILL.md'
              - '.claude/skills/self-improvement/SKILL.md'
              - '.claude/skills/finops/SKILL.md'
              - '.claude/finops/**'
              - '.claude/scripts/finops-snapshot.sh'
              - '.claude/scripts/agent-role-delivery-contract.test.sh'
              - 'libraries/agent-plugins'
              - '.github/workflows/ci.yaml'
            work-priority-ladder:
              - 'AGENTS.md'
              - '.claude/skills/portfolio-maintenance/SKILL.md'
              - '.claude/scripts/work-priority-ladder.test.sh'
              - '.github/workflows/ci.yaml'
            merge-confirmation-read:
              - 'AGENTS.md'
              # every Markdown definition surface, matching the test's own discovery — an enumerated
              # subset would let a change to an unlisted surface skip the check that guards it
              - '.claude/**/*.md'
              - '.claude/**/*.json'
              - '.claude/scripts/merge-confirmation-read.test.sh'
              - '.github/workflows/ci.yaml'
            portfolio-surveyor:
              - 'AGENTS.md'
              - '.claude/agents/daily-maintainer.md'
              - '.claude/agents/portfolio-surveyor.md'
              - '.claude/agents/platform-security-surveyor.md'
              - '.claude/loaders/cursor-daily-ai-engineer.md'
              - '.cursor/environment.json'
              - '.claude/skills/portfolio-maintenance/SKILL.md'
              - '.claude/skills/product-engineering/SKILL.md'
              - '.claude/skills/products/agent-skills/SKILL.md'
              - '.claude/skills/products/ksail/SKILL.md'
              - '.claude/skills/products/monorepo/SKILL.md'
              - '.claude/skills/products/platform/SKILL.md'
              - '.claude/scripts/portfolio-surveyor.test.sh'
              - '.claude/scripts/programmed-bot-review-exemption.sh'
              - '.github/workflows/ci.yaml'
            product-value:
              - 'AGENTS.md'
              - '**/[Aa][Dd][Rr]/**'
              - '**/[Aa][Dd][Rr][Ss]/**'
              - '.claude/agents/daily-maintainer.md'
              - '.claude/skills/portfolio-maintenance/SKILL.md'
              - '.claude/skills/product-engineering/SKILL.md'
              - '.claude/skills/products/monorepo/SKILL.md'
              - '.claude/scripts/product-value-contract.test.sh'
              - 'docs/README.md'
              - '.github/workflows/ci.yaml'

  build-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Build
        working-directory: docs
        run: npm run build

  audit-docs:
    needs: changes
    if: needs.changes.outputs.docs-deps == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Audit
        working-directory: docs
        run: npm audit --omit=dev

  drift-check-active-projects:
    needs: changes
    if: needs.changes.outputs.active-projects == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - name: Install MDX parser dependencies
        working-directory: docs
        run: npm ci
      # Verify the drift checker itself first — self-contained fixtures, no
      # submodule checkout needed, so it fails fast if a refactor broke a check.
      - name: Self-test the drift checker
        run: bash docs/scripts/check-active-projects-drift.test.sh
      # The source-of-truth repo is a public submodule; check it out alone at
      # its pinned commit (no GitHub API, no other submodules). The .gitmodules
      # URL is SSH (git@github.com:), which the runner has no key for, so point
      # it at public HTTPS first to clone anonymously.
      - name: Check out source submodule
        run: |
          git submodule set-url github/devantler-tech/github-actions/actions https://github.com/devantler-tech/actions.git
          git submodule update --init --depth 1 \
            github/devantler-tech/github-actions/actions
      - name: Check Active Projects lists for drift
        run: bash docs/scripts/check-active-projects-drift.sh

  test-agent-telemetry:
    name: Test agent telemetry miner
    needs: changes
    if: needs.changes.outputs.agent-telemetry == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Synthetic session/loader fixtures in an isolated temp HOME — the miner
      # never touches the real agent corpus. Both OSes because the daily runs
      # happen on macOS while CI defaults to Linux, and the miner's date/find
      # flags differ between the two.
      - name: Self-test the agent telemetry miner
        run: bash .claude/scripts/agent-telemetry.test.sh

  test-board-add:
    name: Test board add
    needs: changes
    if: needs.changes.outputs.board-add == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fixture-only run behind a stubbed `gh` on PATH — no network, no token,
      # no live board touched. Both OSes because the daily runs happen on macOS
      # while CI defaults to Linux, and bash/jq portability is what this pins.
      - name: Self-test board-add
        run: bash .claude/scripts/board-add.test.sh

  test-worktree-claim:
    name: Test worktree claim
    needs: changes
    if: needs.changes.outputs.worktree-claim == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hermetic throwaway git repo + worktrees — no network. Both OSes because
      # daily runs are on macOS while CI defaults to Linux, and date(1) parsing
      # of the marker's ISO timestamp is the portability pin (#2284).
      - name: Self-test worktree-claim
        run: bash .claude/scripts/worktree-claim.test.sh

  test-flow-scorecard:
    name: Test flow scorecard
    needs: changes
    if: needs.changes.outputs.flow-scorecard == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fixture-only run behind a poisoned `gh` shim — no network, no token.
      # Both OSes because the daily runs happen on macOS while CI defaults to
      # Linux, and jq/bash portability is exactly what the test pins.
      - name: Self-test the flow scorecard
        run: bash .claude/scripts/flow-scorecard.test.sh

  test-safe-clone:
    needs: changes
    if: needs.changes.outputs.safe-clone == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Self-contained local fixtures (hermetic git config, synthetic secret
      # marker) — no network, no real credentials involved.
      - name: Self-test the safe-clone guard
        run: bash .claude/scripts/safe-clone.test.sh

  test-branch-cleanup:
    name: Test branch cleanup
    needs: changes
    if: needs.changes.outputs.branch-cleanup == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hermetic bare-origin fixture + stubbed `gh` — no network, no token.
      # Pins open-PR survival and SHA-matched MERGED reaping for cursor/*
      # (monorepo#2298), plus the codex-namespace refusal.
      - name: Self-test branch-cleanup namespaces
        run: bash .claude/scripts/branch-cleanup.test.sh

  test-worktree-cleanup:
    name: Test worktree cleanup
    needs: changes
    if: needs.changes.outputs.worktree-cleanup == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hermetic bare-origin fixture — no network, no token. Pins every fail-closed
      # KEEP gate (live process CWD, lock, age, unreachable-from-remote commits,
      # uncommitted work) against a reaped-baseline control, so a run that reaps
      # nothing cannot pass the gate assertions vacuously.
      # The macos leg is load-bearing: the host ships bash 3.2, which cannot parse
      # `case` inside $( ), and the age/stat probes are BSD-flavoured there.
      - name: Self-test worktree-cleanup safety gates
        run: bash .claude/scripts/worktree-cleanup.test.sh
      - name: Self-test the multi-repo orchestrator
        run: bash .claude/scripts/worktree-cleanup-all.test.sh

  test-submodule-init:
    needs: changes
    if: needs.changes.outputs.submodule-init == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Self-contained throwaway git fixtures (hermetic config, file:// submodules)
      # — no network, no real submodules touched. Runs on both OSes because the
      # guard resolves worktree paths with `pwd -P` (macOS /private/tmp symlinks).
      - name: Self-test the submodule-init isolation guard
        run: bash .claude/scripts/submodule-init.test.sh

  test-maintainer-preflight:
    name: Test maintainer preflight contract
    needs: changes
    if: needs.changes.outputs.maintainer-preflight == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the maintainer preflight contract
        run: bash .claude/scripts/maintainer-preflight.test.sh

  drift-check-renovate-dashboard:
    name: Check Renovate Dependency Dashboard drift
    needs: changes
    if: needs.changes.outputs.renovate-dashboard == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .claude/scripts/renovate-dashboard-drift-go/go.mod
          cache: false
      # Verify the guard itself first — hermetic fixtures, no submodule checkout
      # needed — so a refactor that broke a check fails fast and unambiguously.
      - name: Self-test the drift checker
        run: go -C .claude/scripts/renovate-dashboard-drift-go test ./...
      # The guard is network-free: it reads the checked-out working trees, so the
      # repositories that carry a Renovate config have to be present. All four are
      # public, and the .gitmodules URLs are SSH (git@github.com:) which the runner
      # has no key for, so point them at public HTTPS to clone anonymously.
      # A submodule missing here makes the guard exit 2 rather than pass, so this
      # list going stale surfaces as a failure instead of a silent no-op.
      - name: Check out the submodules that carry a Renovate config
        run: |
          set -euo pipefail
          # path:repository, both sides hardcoded HERE and nowhere else.
          #
          # Deliberately NOT derived from .gitmodules: that file is part of the
          # pull request, so reading a clone target out of it would let a PR
          # choose what this job fetches — untrusted input selecting a tool's
          # argument, which the repository's own boundary forbids. It is also
          # deliberately not rebuilt as devantler-tech/<last path segment>: a
          # repository whose GitHub name differs from its directory would get the
          # wrong remote silently, and .gitmodules already contains such a case
          # (github/personal/profile is devantler/devantler). An explicit mapping
          # is the only form that is both trusted and exact.
          for entry in platform:devantler-tech/platform \
                       libraries/kyverno-policies:devantler-tech/kyverno-policies \
                       libraries/provider-upjet-unifi:devantler-tech/provider-upjet-unifi \
                       templates/platform-template:devantler-tech/platform-template; do
            path="${entry%%:*}"
            repo="${entry##*:}"
            git submodule set-url "$path" "https://github.com/${repo}.git"
            git submodule update --init --depth 1 "$path"
          done
      - name: Check Renovate configs for Dependency Dashboard drift
        run: bash .claude/scripts/renovate-dashboard-drift.sh --root .

  test-memory-hygiene:
    name: Test memory hygiene guard
    needs: changes
    if: needs.changes.outputs.memory-hygiene == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
