name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      docs-deps: ${{ steps.filter.outputs.docs-deps }}
      active-projects: ${{ steps.filter.outputs.active-projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            docs:
              - 'docs/**'
            docs-deps:
              - 'docs/package.json'
              - 'docs/package-lock.json'
            active-projects:
              - 'docs/src/content/docs/projects/active.mdx'
              - 'docs/scripts/check-active-projects-drift.sh'
              - 'github/devantler-tech/github-actions/actions'
              - 'github/devantler-tech/github-actions/reusable-workflows'

  build-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Build
        working-directory: docs
        run: npm run build

  audit-docs:
    needs: changes
    if: needs.changes.outputs.docs-deps == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Audit
        working-directory: docs
        run: npm audit --omit=dev

  drift-check-active-projects:
    needs: changes
    if: needs.changes.outputs.active-projects == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # The source-of-truth repos are public submodules; check out only those
      # two (network-free enumeration, no GitHub API). The SSH→HTTPS rewrite
      # lets the runner clone them anonymously.
      - name: Check out source submodules
        run: |
          git config url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 \
            github/devantler-tech/github-actions/actions \
            github/devantler-tech/github-actions/reusable-workflows
      - name: Check Active Projects lists for drift
        run: bash docs/scripts/check-active-projects-drift.sh

  status:
    name: "CI - Required Checks"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-docs
      - audit-docs
      - drift-check-active-projects
    permissions: {}
    steps:
      - name: Check job results
        uses: devantler-tech/actions/aggregate-job-checks@0e1232924bf8b07a40b1b24e13e200744fbabcfa # v6.0.0
        with:
          job-results: >-
            ${{ needs.build-docs.result }}
            ${{ needs.audit-docs.result }}
            ${{ needs.drift-check-active-projects.result }}
