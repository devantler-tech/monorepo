  test-agent-role-delivery-contract:
    name: Test agent-role delivery contract
    needs: changes
    if: needs.changes.outputs.agent-role-delivery-contract == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The contract resolves the declared plugin entrypoint against the agent files the
      # PINNED plugin actually bundles, so that one submodule must be present. Without it the
      # test fails closed rather than skipping — an earlier revision skipped, which made the
      # entrypoint-drift guard a silent no-op here. Only this submodule is initialised (not
      # `submodules: true`, which would also try the private ones), over HTTPS because
      # .gitmodules uses SSH and no deploy key exists in CI. The rewrite is command-scoped and
      # carries no credential: agent-plugins is public and this is an anonymous read.
      #
      # NOT shallow, deliberately. `--depth 1` fetches only the submodule's branch tip, so it
      # resolves the pinned commit ONLY while the pin happens to equal that tip. Every upstream
      # merge moves the tip past the pin and the checkout would then fail — turning an unrelated
      # PR red. agent-plugins is a small markdown marketplace, so a full fetch is the cheap and
      # correct trade.
      - name: Initialise the agent-plugins submodule
        run: |
          git -c 'url.https://github.com/.insteadOf=git@github.com:' \
            submodule update --init libraries/agent-plugins
      - name: Verify the agent-role delivery contract
        run: bash .claude/scripts/agent-role-delivery-contract.test.sh

