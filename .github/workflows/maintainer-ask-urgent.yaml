name: Maintainer urgent ask

# Assigns the maintainer to an ask the moment it is labelled maintainer-ask-urgent, so GitHub emails
# him at once instead of in the weekly digest (monorepo#4285). It runs as github-actions[bot] because
# GitHub never emails a user about their own activity. At most three assignments go out a UTC day;
# runs for two asks labelled in the same moment count at the same time, so only they can pass it.
# The logic and its tests live in .claude/scripts/maintainer-digest.sh.
on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  # One run per issue at a time. A shared group would cancel a waiting run, and so drop an ask.
  group: maintainer-ask-urgent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  assign:
    name: Assign the maintainer
    if: github.event.label.name == 'maintainer-ask-urgent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # to assign the maintainer to the ask
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assign the maintainer to the urgent ask
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
        run: >-
          bash .claude/scripts/maintainer-digest.sh urgent
          --repo "$REPOSITORY" --issue "$ISSUE" --label "$LABEL" --sender "$SENDER"
