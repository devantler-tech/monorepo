name: Desktop app updater

on:
  pull_request:
    paths:
      - tools/desktop-app-updates/**
      - .github/workflows/desktop-app-updates.yaml
  push:
    branches: [main]
    paths:
      - tools/desktop-app-updates/**
      - .github/workflows/desktop-app-updates.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate macOS desktop updater
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/desktop-app-updates/helper/go.mod
          cache: false
      - name: Install validation tools
        run: brew install shellcheck jq
      - name: Validate without touching real desktop clients
        run: bash tools/desktop-app-updates/validate.sh
