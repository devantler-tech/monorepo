name: CI aggregate contract

# An organization ruleset binds this workflow to reviewed main. The candidate
# cannot disable its own control by editing this workflow in the same PR.
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  validate:
    name: Validate CI aggregate execution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out only the reviewed admission implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Run reviewed aggregate admission
        # actionlint 1.7.12 cannot parse $/; the checkout is bound to workflow_sha.
        uses: ./trusted/.github/actions/pr-admission # zizmor: ignore[self-repository]
        with:
          candidate-sha: ${{ github.sha }}
