name: Publish - Pages

on:
  push:
    branches: ["main"]
    paths:
      - "applications/business-site"
      - ".github/workflows/publish-pages.yaml"
      - ".claude/scripts/business-site-revision.sh"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions: {}

jobs:
  revision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - name: Checkout reviewed portfolio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve committed website source
        id: pin
        run: |
          revision=$(bash .claude/scripts/business-site-revision.sh)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

  publish:
    needs: revision
    # Replace with the reviewed source merge commit before this adoption is ready.
    uses: devantler-tech/business-site/.github/workflows/publish-pages.yaml@733d8ac2aad9aeefb648e256ea217ada32717a66
    with:
      source-revision: ${{ needs.revision.outputs.revision }}
    permissions:
      contents: read
      pages: write
      id-token: write
