name: Publish - Pages

on:
  push:
    branches: ["main"]
    paths:
      - "applications/business-site"
      - ".github/workflows/publish-pages.yaml"
      - ".claude/scripts/business-site-revision.sh"
  workflow_dispatch:
  # Refresh only public ranking metadata through this existing Pages publisher.
  schedule:
    - cron: "13 0,6,12,18 * * *"

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions: {}

jobs:
  revision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
    steps:
      - name: Checkout reviewed portfolio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve committed website source
        id: pin
        run: |
          revision=$(bash .claude/scripts/business-site-revision.sh)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

  publish:
    needs: revision
    # Bind publisher code and committed application source to the reviewed source merge.
    uses: devantler-tech/business-site/.github/workflows/publish-pages.yaml@66072da0f685d28b34ece994fe323bc2efb965fa
    with:
      source-revision: ${{ needs.revision.outputs.revision }}
    permissions:
      contents: read
      pages: write
      id-token: write
