name: 🙋 Maintainer ask
description: A decision only the maintainer can make. It reaches him in the weekly digest email.
title: "🙋 Ask: "
type: Chore
labels:
  - maintainer-ask
projects:
  - devantler-tech/5
body:
  - type: markdown
    attributes:
      value: |
        File an ask only when the maintainer must act and no agent can. Name the decision in the title, in a few words.

        This repository is public, and so is the digest that carries the ask. Never include spend findings, credentials, hostnames, IP addresses, phone numbers or other private detail.

        An ask that cannot wait a week (a public site or the production cluster down for two checks in a row, a leaked credential only he can rotate, or a sibling lane's escalation) also gets the `maintainer-ask-urgent` label, which emails him at once.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: The decision he needs to make, in one or two plain sentences.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options
      description: One option per line, lettered A, B and so on, each with what it leads to.
      placeholder: |
        A. …
        B. …
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: The option you recommend, and why, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: if_unanswered
    attributes:
      label: If unanswered
      description: What happens if he does not answer, and when.
    validations:
      required: true
